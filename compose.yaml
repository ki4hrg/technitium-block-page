# Production stack (deployed by Dockhand). The image is built and pushed by GitHub Actions.
#
# Networking: the block page needs its own LAN IP (= blockingAddresses in Advanced Blocking) and
# must see real client source IPs, so it sits on a macvlan network. The admin UI is reached by
# your reverse proxy over the shared "proxy" bridge network (the host itself can't talk to
# macvlan containers, which is why both networks are attached).

services:
  block-page:
    image: ${APP_IMAGE:-ghcr.io/ki4hrg/technitium-block-page:main}
    pull_policy: always
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/New_York}
      TECHNITIUM_TOKEN: ${TECHNITIUM_TOKEN:?}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      HA_API_TOKEN: ${HA_API_TOKEN:-}
    volumes:
      - data:/data
      - ${POLICY_PATH:-./config/policy.yaml}:/config/policy.yaml:ro
    networks:
      lan:
        ipv4_address: ${BLOCK_PAGE_IP:-10.0.0.250}
        # Default route via the LAN so replies to other VLANs go back through the router,
        # not NAT'd out the bridge (requires Docker Engine 28+ / Compose 2.33+).
        gw_priority: 1
      proxy: {}

volumes:
  data:

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: ${LAN_PARENT_IF:-eth0}
    ipam:
      config:
        - subnet: ${LAN_SUBNET:-10.0.0.0/24}
          gateway: ${LAN_GATEWAY:-10.0.0.1}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
