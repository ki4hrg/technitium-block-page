# Production stack (deployed by Dockhand). The image is built and pushed by GitHub Actions.
#
# Networking: the container gets its own LAN IP on a macvlan network. That IP serves both
# listeners:
#   - :80   block page (= blockingAddresses in Advanced Blocking; must see real client IPs)
#   - :3000 admin UI   (point your reverse proxy at http://<BLOCK_PAGE_IP>:3000)
# The Docker host itself can't reach macvlan containers, so the reverse proxy must run on
# another machine (e.g. Caddy on the router).

services:
  block-page:
    image: ${APP_IMAGE:-ghcr.io/ki4hrg/technitium-block-page:main}
    pull_policy: always
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/New_York}
      TECHNITIUM_TOKEN: ${TECHNITIUM_TOKEN:?}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      HA_API_TOKEN: ${HA_API_TOKEN:-}
    volumes:
      - data:/data
      - ${POLICY_PATH:-./config/policy.yaml}:/config/policy.yaml:ro
    networks:
      lan:
        ipv4_address: ${BLOCK_PAGE_IP:-10.0.0.250}

volumes:
  data:

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: ${LAN_PARENT_IF:-eth0}
    ipam:
      config:
        - subnet: ${LAN_SUBNET:-10.0.0.0/24}
          gateway: ${LAN_GATEWAY:-10.0.0.1}
